name: CI/CD Backend Ventas

# ============================================================
# Trigger: Solo se activa con push en la rama deploy
# ============================================================
on:
  push:
    branches:
      - deploy

env:
  IMAGE_NAME: back-ventas
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/back-ventas

jobs:
  # ============================================================
  # JOB 1: BUILD & PUSH — Construye y publica la imagen Docker
  # ============================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraer metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REPO }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build y Push imagen
        uses: docker/build-push-action@v5
        with:
          context: ./Springboot-API-REST
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 2: DEPLOY — Despliega en la instancia EC2 Backend
  # ============================================================
  deploy:
    name: Deploy en EC2 Backend
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_BACKEND_USER }}
          key: ${{ secrets.EC2_BACKEND_SSH_KEY }}
          port: 22
          script: |
            # Login Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Detener y eliminar contenedor anterior
            docker stop back-ventas || true
            docker rm back-ventas || true

            # Pull imagen más reciente
            docker pull ${{ env.DOCKERHUB_REPO }}:latest

            # Levantar contenedor con variables de entorno desde secrets
            docker run -d \
              --name back-ventas \
              --restart unless-stopped \
              -p 8080:8080 \
              -e DB_ENDPOINT=${{ secrets.DB_ENDPOINT }} \
              -e DB_PORT=3306 \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e SPRING_PROFILES_ACTIVE=prod \
              ${{ env.DOCKERHUB_REPO }}:latest

            # Limpiar imágenes antiguas
            docker image prune -f

            echo "✅ Deploy Backend Ventas completado exitosamente"
